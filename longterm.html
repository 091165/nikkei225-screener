<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>理想乖離ダッシュボード — 長期（暴落点）</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0e17;--s1:#111827;--s2:#1a2235;--bd:#1e2a3a;--tx:#e2e8f0;--dim:#64748b;--ac:#38bdf8;--red:#ef4444;--org:#f97316;--ylw:#eab308;--grn:#22c55e;--prp:#a855f7;--pnk:#ec4899;
  --v-strong:#0d9488;--v-buy:#2563eb;--v-watch:#38bdf8;--v-skip:#334155}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP','JetBrains Mono',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}
.nav{display:flex;border-bottom:2px solid var(--bd);background:var(--s1);overflow-x:auto}
.nav a{padding:0.8rem 1.2rem;font-family:'JetBrains Mono',monospace;font-size:0.8rem;font-weight:600;color:var(--dim);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.nav a.nav-active{color:var(--ac);border-bottom-color:var(--ac)}
header{padding:1.2rem 1rem 0.8rem;border-bottom:1px solid var(--bd)}
header h1{font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,var(--ac),#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.meta{font-size:0.72rem;color:var(--dim);margin-top:0.3rem}
.wrap{max-width:1300px;margin:0 auto;padding:1rem}
.note{font-size:0.72rem;color:var(--dim);border-left:3px solid var(--ylw);padding:0.4rem 0.6rem;background:var(--s1);border-radius:4px;margin:0.6rem 0}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--dim);padding:0.45rem 0.9rem;font-size:0.8rem;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--ac);color:var(--bg);font-weight:700}
.sec{font-family:'JetBrains Mono',monospace;font-size:0.95rem;font-weight:700;margin:1.4rem 0 0.6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0.7rem}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:0.9rem}
.card h3{font-size:0.8rem;color:var(--dim);font-weight:600;margin-bottom:0.4rem}
.big{font-family:'JetBrains Mono',monospace;font-size:1.6rem;font-weight:700}
.kv{display:flex;justify-content:space-between;font-size:0.75rem;padding:2px 0;border-bottom:1px dashed var(--bd)}
.kv span:first-child{color:var(--dim)}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:0.65rem;font-weight:700;cursor:pointer;white-space:nowrap}
.sev-none{background:rgba(34,197,94,0.15);color:var(--grn)}
.sev-small{background:rgba(234,179,8,0.2);color:var(--ylw)}
.sev-medium{background:rgba(249,115,22,0.25);color:var(--org)}
.sev-large{background:var(--red);color:#fff}
.v-strong_buy{background:var(--v-strong);color:#fff}
.v-buy{background:var(--v-buy);color:#fff}
.v-watch{border:1px dashed var(--v-watch);color:var(--v-watch)}
.v-skip{background:var(--v-skip);color:#94a3b8}
.v-weak_fundamentals,.v-insufficient{border:1px solid var(--bd);color:var(--dim)}
.weak{background:rgba(239,68,68,0.2);color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.5rem}
.mini{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:0.55rem;cursor:pointer}
.mini:hover{border-color:var(--ac)}
.mini .t{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:0.8rem}
.mini .n{font-size:0.7rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .m{font-size:0.68rem;margin-top:3px;font-family:'JetBrains Mono',monospace}
.filters{display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;margin:0.6rem 0}
.chip{border:1px solid var(--bd);background:transparent;color:var(--dim);padding:0.35rem 0.7rem;border-radius:999px;font-size:0.72rem;cursor:pointer;font-family:inherit}
.chip.on{border-color:var(--ac);color:var(--ac);background:rgba(56,189,248,0.1)}
input.search{padding:0.4rem 0.7rem;background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:0.75rem;width:180px}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:8px;background:var(--s1);max-height:75vh}
table{width:100%;border-collapse:collapse;font-size:0.74rem}
th{position:sticky;top:0;background:var(--s2);padding:0.5rem 0.55rem;text-align:left;font-size:0.65rem;color:var(--dim);white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
th:hover{color:var(--ac)}
td{padding:0.42rem 0.55rem;border-bottom:1px solid var(--bd);white-space:nowrap;font-family:'JetBrains Mono',monospace}
tbody tr{cursor:pointer}
tbody tr:hover td{background:rgba(56,189,248,0.05)}
.neg{color:var(--red)}.pos{color:var(--grn)}.dim{color:var(--dim)}.ok{color:var(--grn)}.ng{color:var(--red)}
.pop{position:fixed;z-index:60;max-width:340px;background:var(--s2);border:1px solid var(--ac);border-radius:8px;padding:0.6rem 0.7rem;font-size:0.72rem;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto}
.modal.open{display:flex}
.panel{background:var(--bg);border:1px solid var(--bd);border-radius:12px;width:min(1000px,100%);margin:2rem 0.5rem;padding:1rem;position:relative}
.close{position:absolute;top:0.6rem;right:0.8rem;background:transparent;border:0;color:var(--dim);font-size:1.4rem;cursor:pointer}
.reasons{font-size:0.75rem;line-height:1.8;margin:0.5rem 0}
.cv{position:relative;height:280px}
.cv.small{height:180px}
details summary{cursor:pointer;color:var(--ac);font-size:0.78rem;margin:0.4rem 0}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:110px;margin-top:0.4rem}
.mbar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:0.55rem;color:var(--dim)}
.mbar i{display:block;width:100%;border-radius:2px 2px 0 0}
.mbar.cur{color:var(--tx);font-weight:700}
.mbar.cur i{outline:2px solid var(--ac)}
.line{font-size:0.78rem;padding:3px 0;border-bottom:1px dashed var(--bd)}
.line b{color:var(--ac)}
.tag{display:inline-block;font-size:0.6rem;padding:1px 5px;border-radius:3px;background:var(--s2);color:var(--tx);margin:1px;white-space:nowrap}
.tags{white-space:normal;min-width:140px;max-width:260px}
.g-A{color:var(--grn);font-weight:700}.g-B{color:var(--ac);font-weight:700}.g-C{color:var(--ylw)}
.vt{color:var(--dim)}
.list{font-size:0.75rem;line-height:1.7}
.list .mono{font-size:0.72rem}
select{background:var(--s2);border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:0.35rem;font-size:0.75rem}
.calc input{width:120px}
@media (max-width:640px){.panel{margin:0;border-radius:0;min-height:100vh}.cv{height:220px}.big{font-size:1.3rem}input.search{width:100%}}
</style>
</head>
<body>
<div class="nav">
  <a href="index.html">🇯🇵 日本株</a>
  <a href="us.html">🇺🇸 米国株</a>
  <a href="longterm.html" class="nav-active">📉 長期（暴落点）</a>
  <a href="holdings.html">💼 保有管理</a>
</div>
<header>
  <h1>長期（暴落点）</h1>
  <div class="meta" id="meta">読み込み中…</div>
</header>
<div class="wrap">
  <div class="seg" id="region"><button data-r="jp" class="on">日本株</button><button data-r="us">米国株</button></div>
  <div class="note">ルールは機械的な目安です。最終判断はチャートを自分の目で確認してください。</div>

  <div class="sec">地合い</div>
  <div class="grid" id="market"></div>
  <div id="weakRank"></div>
  <div class="grid" id="extraLists" style="margin-top:0.7rem"></div>
  <details id="calcBox"><summary>暴落時の均等買い計算</summary>
    <div class="card calc">
      <div class="filters">
        <select id="calcTarget"><option value="all">日経225（日本株）/ 表示中の地域の全銘柄</option><option value="watch">ウォッチリストのみ</option></select>
        <label class="dim" style="font-size:0.72rem">除外する株価の上限 <input id="calcCap" type="number" value="10000" inputmode="numeric"></label>
      </div>
      <div class="dim" style="font-size:0.7rem">基準 = 対象のうち一番高い株価。各銘柄の株数 = 基準 ÷ 株価（四捨五入、単元未満株・ミニ株の1株単位を想定）</div>
      <div class="tw" style="max-height:50vh;margin-top:0.4rem"><table id="calcTbl"></table></div>
    </div>
  </details>
  <details><summary>過去の暴落点一覧</summary><div class="tw" style="max-height:50vh"><table id="crashTbl"></table></div></details>

  <div class="sec">今日の長期買い候補</div>
  <div class="cards" id="buyCards"></div>
  <div class="sec">次の暴落で買う監視リスト（上位20）</div>
  <div class="cards" id="watchCards"></div>
  <div class="sec">上位10 <select id="topSort"><option value="madakabu">まだ株格付け順</option><option value="buy_score">既存の買いスコア順</option></select></div>
  <div class="cards" id="topCards"></div>

  <div class="sec">全銘柄</div>
  <div class="filters" id="vFilters"></div>
  <div class="filters">
    <button class="chip" data-f="index">指数要因</button>
    <button class="chip" data-f="individual">個別要因</button>
    <button class="chip" data-f="growth">成長株のみ</button>
    <button class="chip" data-f="yield">高配当のみ</button>
    <button class="chip" data-f="gradeAB">配当格付けA・B</button>
    <button class="chip" data-f="watch">ウォッチ</button>
    <select id="sortPreset"><option value="verdict">判定順</option><option value="madakabu">まだ株格付け順</option><option value="buy_score">既存の買いスコア順</option></select>
    <input class="search" id="q" placeholder="コード・銘柄名で検索">
  </div>
  <div class="tw"><table id="tbl"></table></div>
</div>

<div class="modal" id="modal"><div class="panel" id="panel"></div></div>

<script>
const BASE = 'data/longterm/';
const VERDICTS = {strong_buy:'長期買い強', buy:'長期買い', watch:'監視', skip:'見送り', weak_fundamentals:'業績未達', insufficient:'判定不能'};
const SEV = {small:'小暴落', medium:'中暴落', large:'大暴落'};
const KIND = {index:'指数', individual:'個別', both:'指数・個別'};
const state = {region:'jp', verdicts:new Set(), flags:new Set(), q:'', sort:{key:'verdict', asc:true}};
let summary = null, market = null, charts = [];

const f1 = v => v == null ? '—' : (+v).toFixed(1);
const pct = v => v == null ? '—' : `<span class="${v < 0 ? 'neg' : 'pos'}">${(+v).toFixed(1)}%</span>`;
const yn = v => v == null ? '<span class="dim">—</span>' : (v ? '<span class="ok">✔</span>' : '<span class="ng">✖</span>');
const num = v => v == null ? '—' : (+v).toLocaleString('ja-JP', {maximumFractionDigits: v < 100 ? 2 : 0});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isJP = r => r.ticker.endsWith('.T');
const VORDER = {strong_buy:0, buy:1, watch:2, insufficient:3, weak_fundamentals:4, skip:5};

async function load() {
  try {
    [summary, market] = await Promise.all([fetch(BASE + 'summary.json').then(r => r.json()),
                                           fetch(BASE + 'market.json').then(r => r.json())]);
  } catch (e) {
    document.getElementById('meta').textContent = 'データを読み込めませんでした（まだ生成されていない可能性があります）';
    return;
  }
  document.getElementById('meta').textContent = `更新: ${summary.generated_at}　/　${summary.stocks.length}銘柄`;
  renderVerdictFilters();
  render();
}

function rows() {
  return summary.stocks.filter(r => state.region === 'jp' ? isJP(r) : !isJP(r));
}

function sevBadge(s) {
  return s ? `<span class="badge sev-${s}">${SEV[s]}</span>` : '<span class="badge sev-none">平常</span>';
}

function renderMarket() {
  const m = market[state.region];
  const el = document.getElementById('market');
  let html = '';
  for (const ix of m.indices) {
    const name = {'^N225':'日経平均','^GSPC':'S&P500','^DJI':'ダウ'}[ix.ticker] || ix.ticker;
    html += `<div class="card"><h3>${name}（${ix.as_of}）</h3>
      <div class="big ${ix.deviation < 0 ? 'neg' : 'pos'}">${ix.deviation.toFixed(2)}%</div>
      <div style="margin:4px 0">${sevBadge(ix.severity_now)} <span class="dim" style="font-size:0.7rem">25日乖離率</span></div>
      <div class="kv"><span>理想乖離 -2σ / -3σ</span><span class="mono">${f1(ix.lower2)}% / ${f1(ix.lower3)}%</span></div>
      <div class="kv"><span>-2σまで</span><span class="mono">${f1(ix.dist_to_lower2)}pt</span></div>
      <div class="kv"><span>暴落点のしきい値</span><span class="mono">${f1(ix.threshold)}%</span></div>
      <div class="kv"><span>最後の暴落点</span><span class="mono">${ix.last_crash || '—'}（${ix.days_since_last_crash ?? '—'}日前）</span></div>
      <div class="kv"><span>判定リセット日</span><span class="mono">${ix.reset_date || '—'} ${ix.armed ? '<span class="ok">（リセット済み）</span>' : ''}</span></div>
    </div>`;
  }
  const b = m.breadth || {};
  html += `<div class="card"><h3>地合いの悪さ（${state.region === 'jp' ? '日経225採用' : '米国株'} ${b.n || 0}銘柄）</h3>
    ${b.weak ? '<span class="badge weak">地合い悪化</span>' : '<span class="badge sev-none">通常</span>'}
    <div class="kv"><span>当日下落した銘柄</span><span class="mono">${f1(b.down_pct)}%</span></div>
    <div class="kv"><span>25日線より下の銘柄</span><span class="mono">${f1(b.below_ma_pct)}%</span></div></div>`;
  const ix0 = m.indices[0];
  const now = new Date(), cur = now.getMonth() + 1, next = cur % 12 + 1;
  const vals = ix0.seasonality.map(s => s.avg ?? 0), mx = Math.max(...vals.map(Math.abs), 0.1);
  html += `<div class="card"><h3>月別アノマリー（${ix0.ticker}、全期間の月足）</h3><div class="months">` +
    ix0.seasonality.map(s => {
      const h = Math.abs(s.avg ?? 0) / mx * 80;
      return `<div class="mbar ${s.month === cur || s.month === next ? 'cur' : ''}" title="${s.month}月 平均${f1(s.avg)}% 勝率${f1(s.win_rate)}%">
        <span>${f1(s.avg)}</span><i style="height:${h}px;background:${(s.avg ?? 0) >= 0 ? 'var(--grn)' : 'var(--red)'}"></i><span>${s.month}</span></div>`;
    }).join('') + `</div><div class="dim" style="font-size:0.65rem;margin-top:4px">今月（${cur}月）勝率 ${f1(ix0.seasonality[cur-1].win_rate)}% ／ 来月（${next}月）勝率 ${f1(ix0.seasonality[next-1].win_rate)}%</div></div>`;
  if (state.region === 'jp') {
    const st = m.index_stage || {}, bs = b.stage || {};
    html = `<div class="card" style="grid-column:1/-1"><h3>今の地合い（${esc(m.breadth_note || '')}）</h3>
      <div class="line">日経平均の25日乖離 <b>${f1(m.indices[0].deviation)}%</b>：${esc(st.label || '—')}</div>
      <div class="line">下方乖離（25日線より下） <b>${b.n ? Math.round(b.below_ma_pct * b.n / 100) : '—'}／${b.n || '—'}銘柄（${f1(b.below_ma_pct)}%）</b>：${esc(bs.label || '—')}　-2σ以下 ${b.below_lower2_n ?? '—'}銘柄</div>
      ${b.adr25 != null ? `<div class="line">25日騰落レシオ <b>${f1(b.adr25)}%</b>（${esc(b.adr25_label)}）　直近1年の最低 ${f1(b.adr25_min_1y)}%まで あと${f1(b.adr25 - b.adr25_min_1y)}pt</div>` : ''}
      <div class="line">今月（${cur}月）は${esc(m.month_tendency || '')}</div>
      <div class="line">${m.nikkei_per ? `日経平均PER <b>${f1(m.nikkei_per.value)}倍</b>（${esc(m.nikkei_per.label)}、${esc(m.nikkei_per.date)}時点。目安：${m.nikkei_per_range[0]}倍で買い場・${m.nikkei_per_range[1]}倍でいったん売り）`
        : '日経平均PER：未入力（manual_inputs.csv に週1回入力すると表示されます）'}</div>
      <div class="line">配当格付けA <b>${rows().filter(r => r.div_grade === 'A').length}銘柄</b>（B ${rows().filter(r => r.div_grade === 'B').length}銘柄）</div>
      ${m.yen_strong != null ? `<div class="line">ドル円の25日乖離 ${f1(m.usdjpy_dev)}%：${m.yen_strong ? '円高方向（内需株に追い風）' : '円安方向'}</div>` : ''}
      ${m.ex_dividend_notice ? `<div class="line" style="color:var(--ylw)">${esc(m.ex_dividend_notice)}</div>` : ''}
      ${spark(m.breadth_history || [])}
    </div>` + html;
  } else {
    const mc = m.macro || {}, sg = mc.signals || {}, t = mc.t10y2y, p = mc.payems;
    html += `<div class="card"><h3>景気後退のサイン・金利（参考）</h3>
      ${sg.both ? '<div class="line" style="color:var(--red)"><b>景気後退のサインが2つそろっている</b></div>' : ''}
      <div class="line">長短金利差（10年−2年）：${t ? `<b class="${t.value < 0 ? 'neg' : ''}">${t.value >= 0 ? '+' : ''}${t.value.toFixed(2)}%</b>（${t.value < 0 ? '逆転中' : '逆転なし'}、${esc(t.date)}${t.stale ? '時点の前回値' : ''}）` : '取得できませんでした'}</div>
      <div class="line">雇用者数の前月比：${p ? `<b class="${p.change < 0 ? 'neg' : ''}">${p.change >= 0 ? '+' : ''}${(p.change / 10000).toFixed(1)}万人</b>（${esc(p.date)}${p.stale ? '時点の前回値' : ''}）` : '取得できませんでした'}</div>
      <div class="line">米10年債利回り：${m.bond_yield != null ? `<b>${f1(m.bond_yield)}%</b>（株の配当は最低でも+2%ほしい）` : '—'}</div>
      ${m.debt_caps_warning ? `<div class="line" style="color:var(--ylw)">借金の大きい大型株（${(m.debt_caps || []).join('・')}）がそろって-2σ以下：金融の引き締まりに注意</div>` : ''}
    </div>`;
  }
  if (state.region !== 'jp' && m.vix) {
    html += `<div class="card"><h3>恐怖指数 VIX（参考）</h3><div class="big">${f1(m.vix.value)}</div>
      <div class="dim" style="font-size:0.7rem">${m.vix.as_of}。判定・スコアには使いません。恐怖指数が高くても、乖離率が浅ければ見送りが基本。</div></div>`;
  }
  el.innerHTML = html;
  renderLists();

  // 地合い悪化時: 下方乖離が深い順（業績が不合格でないもの）
  const wr = document.getElementById('weakRank');
  if (b.weak) {
    const list = rows().filter(r => r.d !== false).sort((a, c) => a.deviation - c.deviation).slice(0, 10);
    wr.innerHTML = `<div class="sec">地合い悪化中：下方乖離が深い順（業績に問題が見つかっていない銘柄）</div><div class="cards">${list.map(r => miniCard(r)).join('')}</div>`;
  } else wr.innerHTML = '';

  document.getElementById('crashTbl').innerHTML = `<thead><tr><th>暴落点</th><th>最大乖離率</th><th>暴落度</th><th>3か月後</th><th>6か月後</th><th>12か月後</th><th>メモ</th></tr></thead><tbody>` +
    [...ix0.crashes].reverse().map(c => `<tr><td>${c.date}</td><td>${pct(c.min_deviation)}</td><td>${c.severity ? SEV[c.severity] : '—'}</td>
      <td>${pct(c.ret_3m)}</td><td>${pct(c.ret_6m)}</td><td>${pct(c.ret_12m)}</td><td style="font-family:inherit">${esc(c.note || '')}</td></tr>`).join('') + '</tbody>';
}

function spark(hist) {
  if (!hist.length) return '';
  const v = hist.map(h => +h.below_ma_pct), W = 300, H = 50;
  const x = i => hist.length > 1 ? i / (hist.length - 1) * W : W / 2, y = val => H - val / 100 * H;
  const pts = v.map((val, i) => `${x(i).toFixed(1)},${y(val).toFixed(1)}`).join(' ');
  return `<div class="dim" style="font-size:0.65rem;margin-top:6px">下方乖離の割合の推移（直近${hist.length}日、点線=50%）</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:420px;height:50px"><line x1="0" x2="${W}" y1="${y(50)}" y2="${y(50)}" stroke="#64748b" stroke-dasharray="3 3"/>
    <polyline fill="none" stroke="#38bdf8" stroke-width="1.5" points="${pts}"/></svg>`;
}

  if ((L.sector_value || []).length) h += `<div class="card"><h3>低PBR×高配当が多いセクター（PBR1倍割れ・利回り3%以上）</h3><div class="list">${L.sector_value.map(s => `<div>${esc(s.sector)} <span class="mono dim">${s.hits}/${s.n}銘柄（${f1(s.pct)}%）</span></div>`).join('')}</div></div>`;

}

function renderCalc() {
  const cap = +document.getElementById('calcCap').value || Infinity;
  let rs = rows();
  if (document.getElementById('calcTarget').value === 'watch') rs = rs.filter(r => r.watchlist);
  rs = rs.filter(r => r.price && r.price < cap);
  const t = document.getElementById('calcTbl');
  if (!rs.length) { t.innerHTML = '<tr><td class="dim">対象がありません</td></tr>'; return; }
  const base = Math.max(...rs.map(r => r.price));
  let total = 0;
  const body = rs.sort((a, b) => b.price - a.price).map(r => {
    const n = Math.max(1, Math.round(base / r.price)), amt = n * r.price; total += amt;
    return `<tr><td>${esc(r.ticker)}</td><td style="font-family:inherit">${esc(r.name)}</td><td>${num(r.price)}</td><td>${n}</td><td>${num(amt)}</td></tr>`;
  }).join('');
  t.innerHTML = `<thead><tr><th>コード</th><th>銘柄</th><th>株価</th><th>株数</th><th>金額</th></tr></thead><tbody>${body}
    <tr><td colspan="4"><b>合計（${rs.length}銘柄、基準 ${num(base)}）</b></td><td><b>${num(total)}</b></td></tr></tbody>`;
}

function renderTop() {
  const key = document.getElementById('topSort').value;
  const top = rows().filter(r => r[key] != null).sort((a, b) => b[key] - a[key]).slice(0, 10);

}

function miniCard(r, note) {
  return `<div class="mini" data-t="${esc(r.ticker)}"><div class="t">${esc(r.ticker)} ${vBadge(r)}</div><div class="n">${esc(r.name)}</div>

}

function vBadge(r) {
  return `<span class="badge v-${r.verdict}" data-why="${esc(r.ticker)}">${VERDICTS[r.verdict]}</span>`;

function renderCards() {

];

function renderTable() {
  let rs = rows();
  const yieldTh = state.region === 'jp' ? 4 : 6;
  if (state.verdicts.size) rs = rs.filter(r => state.verdicts.has(r.verdict));
  if (state.flags.has('index')) rs = rs.filter(r => r.latest_crash_kind === 'index' || r.latest_crash_kind === 'both');
  if (state.flags.has('individual')) rs = rs.filter(r => r.latest_crash_kind === 'individual' || r.latest_crash_kind === 'both');
  if (state.flags.has('growth')) rs = rs.filter(r => r.growth_stock);
  if (state.flags.has('yield')) rs = rs.filter(r => (r.div_yield || 0) >= yieldTh);
  if (state.flags.has('gradeAB')) rs = rs.filter(r => r.div_grade === 'A' || r.div_grade === 'B');
  if (state.flags.has('watch')) rs = rs.filter(r => r.watchlist);
  if (state.q) { const q = state.q.toLowerCase(); rs = rs.filter(r => r.ticker.toLowerCase().includes(q) || (r.name || '').toLowerCase().includes(q)); }
  const {key, asc} = state.sort;
  const val = r => key === 'verdict' ? VORDER[r.verdict] * 1000 + (r.dist_to_lower2 ?? 0)
    : key === 'div_grade' ? GORDER[r.div_grade] : key === 'pl_trend' ? PLORDER[r.pl_trend] ?? 0
    : key === 'tags' ? (r.tags || []).length : r[key];
  rs.sort((a, b) => { const x = val(a), y = val(b); if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * (asc ? 1 : -1); });
  const t = document.getElementById('tbl');
  t.innerHTML = `<thead><tr>${COLS.map(([k, l]) => `<th data-k="${k}">${l}${state.sort.key === k ? (asc ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>` +
    rs.map(r => `<tr data-t="${esc(r.ticker)}">
      <td>${vBadge(r)}</td><td>${esc(r.ticker)}</td><td style="font-family:inherit">${esc(r.name)}</td><td class="dim" style="font-family:inherit">${esc(r.sector || '')}</td>
      <td>${num(r.price)}</td><td>${pct(r.deviation)}</td><td>${f1(r.dist_to_lower2)}%</td>
      <td>${r.latest_crash_date || '—'} <span class="dim">${KIND[r.latest_crash_kind] || ''}</span></td>
      <td>${r.days_since_high ?? '—'}日${r.b_exception ? '<span class="dim">*</span>' : ''} ${yn(r.b)}</td>
      <td>${r.c_streak} ${yn(r.c)}</td>
      <td>売${r.revenue_streak}/益${r.net_income_streak} ${yn(r.d)}${r.growth_stock ? ' <span class="pos">成長</span>' : ''}</td>
      <td>${yn(r.relative_strength)}</td><td>${yn(r.monthly_po)}</td>
      <td class="${r.below_vt ? 'vt' : ''}" title="${r.below_vt ? 'VT（約2%）以下' : ''}">${r.div_yield ? (+r.div_yield).toFixed(2) + '%' : '—'}</td>
      <td>${r.madakabu ?? '—'}</td><td class="g-${r.div_grade}">${r.div_grade || '—'}</td>
      <td class="${r.pl_trend === 'down' ? 'neg' : r.pl_trend === 'up' ? 'pos' : ''}">${PL[r.pl_trend] || '—'}</td><td>${r.buy_score ?? '—'}</td>
      <td class="tags" style="font-family:inherit">${(r.tags || []).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</td></tr>`).join('') + '</tbody>';
}

      ${kv('欠けている条件', (dv.missing || []).join('・') || 'なし')}

      ${kv('配当性向の推移', (dv.payout_history || []).map(v => v.toFixed(0) + '%').join(' → ') || '—')}
      ${dv.payout_jump ? kv('注意', '<span class="ng">配当が利益に対して重い（配当性向の急上昇）</span>') : ''}
      ${dv.growth ? kv('配当5年成長率 / 減配した年', `${f1(dv.growth.cagr_5y)}% / ${dv.growth.drawdown_years ?? '—'}回`) : ''}
      ${sc.yield_range && sc.yield_range.pct != null ? kv('利回りの過去比（20年）', `${f1(sc.yield_range.pct)}%（今 ${f1(sc.yield_range.now)}%、上限 ${f1(sc.yield_range.max)}%）`) : ''}
      ${sc.price_at_7pct ? kv('利回り7%になる株価', `${num(sc.price_at_7pct.price)}（${f1(sc.price_at_7pct.pct)}%）`) : ''}
      ${sc.aristocrat && sc.aristocrat !== '—' ? kv('配当貴族', esc(sc.aristocrat)) : ''}
      ${bars ? '<div class="dim" style="font-size:0.65rem;margin-top:4px">年間配当の推移</div>' + bars : ''}</div>
    ${fundCard(d)}
    <div class="card"><h3>チャートの形</h3>
      ${kv('下げ止まり', `${yn((sc.bottoming || {}).pass)} 安値更新停止${yn((sc.bottoming || {}).no_new_low)} 下辺水平${yn((sc.bottoming || {}).flat_bottom)} 下ヒゲ${yn((sc.bottoming || {}).lower_wick)}`)}
      ${kv('水平サポート', sc.support && sc.support.nearest ? `${num(sc.support.nearest)}（${f1(sc.support.pct)}%、${sc.support.touches}回）` : '—')}
      ${kv('節目', sc.round_level ? `${num(sc.round_level.price)}（${f1(sc.round_level.pct)}%）` : '—')}
      ${kv('逆指値の目安（直近の押し安値）', sc.trailing_stop ? num(sc.trailing_stop) : '—')}
      ${kv('月足', `連続陽線 ${mo.bull_streak ?? '—'}本 / 直前の連続陰線 ${mo.bear_streak_before ?? '—'}本`)}
      ${kv('暴落点（' + (cs.date || '—') + '）', cs.held == null ? '—' : (cs.held ? '安値割れず' : '直前6か月の安値を割った') + (cs.above_crash_low_pct != null ? `／安値から ${f1(cs.above_crash_low_pct)}%` : ''))}
      ${kv('最高値から', `${f1(dp.drop_from_ath)}%下（${dp.ath_date || '—'}、${dp.days_since_ath ?? '—'}営業日前）`)}
      ${kv('パーフェクトオーダー（5>25>75日線）', dp.po_now ? '今' : `${dp.days_since_po ?? '—'}営業日前`)}
      ${kv('分類', esc(dp.type || '—'))}
      ${kv('理想乖離の効きやすさ', esc(sc.band_label || '—'))}
      ${kv('PBRの過去比', sc.pbr_percentile != null ? f1(sc.pbr_percentile) + '%（0%=過去最低）' : '—')}
      ${kv('直近20日の対指数', sc.rel20 != null ? f1(sc.rel20) + 'pt' : '—')}
      ${kv('10年で', sc.gain_10y ? sc.gain_10y.toFixed(1) + '倍' : '—')}
      ${kv('今月の傾向', ms(sc.month_now))}
      ${kv('来月の傾向', ms(sc.month_next))}
      ${sc.pair ? kv('米国の同業（' + esc(sc.pair.ticker) + '）', `25日乖離 ${f1(sc.pair.deviation)}%${sc.pair.at_lower2 ? '（-2σ以下）' : ''}`) : ''}
    </div></div>`;
}

function fundCard(d) {
  const sc = d.screens || {}, f = sc.fundamentals, bs = sc.buy_style || {};
  if (!f) return '';
  const jp = d.ticker.endsWith('.T');
  const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;
  const ar = x => PL[x] || '—';
  const big = v => v == null ? '—' : num(v / 1e8) + '億';
  return `<div class="card"><h3>業績・資産（${jp ? '日本株：PBR・DOEを見る' : '米国株：連続増配・ROA・PSRを見る'}）</h3>
    ${kv('業績の推移', `<b>${ar(f.pl.trend)}</b>（売上${ar(f.pl.revenue)} 経常${ar(f.pl.ordinary)} 純利益${ar(f.pl.net_income)}）`)}
    ${kv('売上高', (f.revenue || []).map(big).join(' → ') || '—')}
    ${kv('純利益', (f.net_income || []).map(big).join(' → ') || '—')}
    ${jp ? kv('DOE（推移）', f.equity_negative ? '—（株主資本がマイナス）' : ((f.doe_history || []).map(v => v == null ? '—' : v.toFixed(1) + '%').join(' → ') || '—') + (f.doe_jumped ? ' <span class="ng">急上昇</span>' : '')) : ''}
    ${!jp ? kv('ROA', f.roa != null ? f1(f.roa) + '%' : '—') : ''}
    ${kv('PSR（時価総額÷売上）', f.psr != null ? f.psr.toFixed(2) + '倍' : '—')}
    ${f.equity_negative ? kv('注意', '株主資本がマイナス（PBR・DOEは使えない）') : ''}
    ${!jp && sc.bond_spread != null ? kv('配当利回り − 米10年債', `${sc.bond_spread >= 0 ? '+' : ''}${f1(sc.bond_spread)}%`) : ''}
    ${kv('買い方の型', esc(bs.style || '—'))}
    ${(bs.notes || []).map(n => kv('', `<span style="color:var(--ylw)">${esc(n)}</span>`)).join('')}
    ${kv('上方乖離の見分け', esc(sc.upside || '—'))}
  </div>`;
}

function closeDetail() { document.getElementById('modal').classList.remove('open'); charts.forEach(c => c.destroy()); charts = []; }

function drawCharts(d) {
  const ch = d.chart, labels = ch.d;
  const grid = {color: 'rgba(100,116,139,0.15)'}, tick = {color: '#64748b', maxTicksLimit: 8, font: {size: 10}};
  // 重ね表示はラベルと同じ長さの配列（該当日以外は null）で作る
  const idxOf = date => { const i = labels.findIndex(x => x >= date); return i; };
  const series = () => labels.map(() => null);
  const pts = d.crash_points.filter(p => p.date >= labels[0] && p.low != null);
  const mk = kind => { const a = series(); pts.filter(p => kind === 'index' ? p.kind !== 'individual' : p.kind === 'individual')
    .forEach(p => { const i = idxOf(p.low_date || p.date); if (i >= 0) a[i] = p.low; }); return a; };
  const lowLine = series(); pts.forEach(p => { const i = idxOf(p.low_date || p.date); if (i >= 0) lowLine[i] = p.low; });
  const ath = series(); (d.ath_marks || []).forEach(x => { const i = idxOf(x); if (i >= 0) ath[i] = ch.c[i]; });
  charts.push(new Chart(document.getElementById('cPrice'), {
    type: 'line',
    data: {labels, datasets: [
      {label: '終値', data: ch.c, borderColor: '#38bdf8', borderWidth: 1.2, pointRadius: 0, tension: 0},
      {label: '暴落点の安値', data: lowLine, borderColor: '#eab308', borderDash: [4, 4], borderWidth: 1.2, pointRadius: 0, spanGaps: true},
      {label: '指数要因', data: mk('index'), showLine: false, backgroundColor: '#f97316', borderColor: '#f97316', pointRadius: 5},
      {label: '個別要因', data: mk('individual'), showLine: false, backgroundColor: '#a855f7', borderColor: '#a855f7', pointStyle: 'rectRot', pointRadius: 6},
      {label: '高値更新', data: ath, showLine: false, backgroundColor: 'rgba(34,197,94,0.8)', borderColor: 'rgba(34,197,94,0.8)', pointStyle: 'triangle', pointRadius: 3},
    ]},
    options: {animation: false, maintainAspectRatio: false, interaction: {mode: 'nearest', intersect: false},
      plugins: {legend: {display: false}}, scales: {x: {ticks: tick, grid}, y: {ticks: tick, grid}}}
  }));
  const ideal = d.ideal, lb = d.legacy_lower_band;
  const hline = (v, color, dash) => ({data: labels.map(() => v), borderColor: color, borderWidth: 1, borderDash: dash || [], pointRadius: 0});
  const devSets = [{label: '乖離率', data: ch.v, borderColor: '#94a3b8', borderWidth: 1, pointRadius: 0},
    {label: '-2σ', ...hline(ideal.lower2, '#f97316', [4, 3])}, {label: '-3σ', ...hline(ideal.lower3, '#ef4444', [4, 3])},
    {label: '+2σ', ...hline(ideal.upper2, '#a855f7', [4, 3])}, {label: '+3σ', ...hline(ideal.upper3, '#ec4899', [4, 3])}];
  if (lb) devSets.push({label: '旧方式下限', ...hline(lb.threshold, '#eab308', [1, 3])});
  charts.push(new Chart(document.getElementById('cDev'), {type: 'line', data: {labels, datasets: devSets},
    options: {animation: false, maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {x: {ticks: tick, grid}, y: {ticks: tick, grid}}}}));
  const h = d.histogram;
  charts.push(new Chart(document.getElementById('cHist'), {type: 'bar',
    data: {labels: h.counts.map((_, i) => h.edges[i].toFixed(0)), datasets: [{data: h.counts,
      backgroundColor: h.counts.map((_, i) => h.edges[i + 1] <= ideal.lower2 ? '#f97316' : h.edges[i] >= ideal.upper2 ? '#a855f7' : '#334155')}]},
    options: {animation: false, maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {x: {ticks: tick, grid: {display: false}}, y: {ticks: tick, grid}}}}));
  const s = d.seasonality;
  charts.push(new Chart(document.getElementById('cSeason'), {type: 'bar',
    data: {labels: s.map(x => x.month + '月'), datasets: [{data: s.map(x => x.avg), backgroundColor: s.map(x => (x.avg || 0) >= 0 ? '#22c55e' : '#ef4444')}]},
    options: {animation: false, maintainAspectRatio: false, plugins: {legend: {display: false},
      tooltip: {callbacks: {label: c => `平均 ${f1(c.raw)}% / 勝率 ${f1(s[c.dataIndex].win_rate)}%（${s[c.dataIndex].n}年）`}}},
      scales: {x: {ticks: tick, grid: {display: false}}, y: {ticks: tick, grid}}}}));
}

// ─── イベント ───
document.addEventListener('click', e => {
  const why = e.target.closest('[data-why]');
  if (why) { e.stopPropagation(); showWhy(why.dataset.why, e.clientX, e.clientY); return; }
  closePop();
  const th = e.target.closest('th[data-k]');
  if (th) { const k = th.dataset.k; state.sort = {key: k, asc: state.sort.key === k ? !state.sort.asc : true}; renderTable(); return; }
  const rb = e.target.closest('#region button');
  if (rb) { state.region = rb.dataset.r; document.querySelectorAll('#region button').forEach(b => b.classList.toggle('on', b === rb)); render(); return; }
  const vc = e.target.closest('[data-v]');
  if (vc) { const v = vc.dataset.v; state.verdicts.has(v) ? state.verdicts.delete(v) : state.verdicts.add(v); vc.classList.toggle('on'); renderTable(); return; }
  const fc = e.target.closest('[data-f]');
  if (fc) { const f = fc.dataset.f; state.flags.has(f) ? state.flags.delete(f) : state.flags.add(f); fc.classList.toggle('on'); renderTable(); return; }
  if (e.target.id === 'modal') { closeDetail(); return; }
  const row = e.target.closest('[data-t]');
  if (row) openDetail(row.dataset.t);
});
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; renderTable(); });
document.getElementById('sortPreset').addEventListener('change', e => { const k = e.target.value; state.sort = {key: k, asc: k === 'verdict'}; renderTable(); });
document.getElementById('topSort').addEventListener('change', renderTop);
document.getElementById('calcCap').addEventListener('input', renderCalc);
document.getElementById('calcTarget').addEventListener('change', renderCalc);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePop(); closeDetail(); } });
load();
</script>
</body>
</html>
