name: Long-term Logic Tests

on:
  push:
    paths:
      - "longterm/**"
      - "tests/**"
      - "config/**"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Unit tests
        run: python -m pytest -v

      - name: Real-data tests (Yahoo Finance)
        env:
          RUN_NETWORK_TESTS: "1"
        run: python -m pytest -v -s -m network

      - name: Smoke run (sample tickers)
        run: python scripts/run_longterm.py --tickers 3038.T 4776.T 6035.T 5301.T 9697.T 2593.T 7203.T AAPL MSFT KO --out /tmp/longterm

      - name: Upload sample JSON
        uses: actions/upload-artifact@v4
        with:
          name: longterm-sample-json
          path: /tmp/longterm
          retention-days: 7
