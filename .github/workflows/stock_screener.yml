name: Stock Deviation Screener

on:
  # 毎営業日 16:30 JST = 07:30 UTC
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      - name: Run stock screener
        run: |
          mkdir -p output
          OUTPUT_DIR=output python stock_deviation_screener.py

      # ─── 長期（暴落点）タブ ───
      # 株価・業績のキャッシュは Actions cache に保存（リポジトリにはコミットしない）
      - name: Restore long-term data cache
        uses: actions/cache@v5
        with:
          path: data/cache
          key: longterm-cache-${{ github.run_id }}
          restore-keys: longterm-cache-

      - name: Long-term (crash point) analysis
        continue-on-error: true   # 失敗しても既存ダッシュボードの更新は止めない
        env:
          LONGTERM_CACHE: data/cache
        run: |
          start=$(date +%s)
          python scripts/run_longterm.py
          echo "long-term step took $(( $(date +%s) - start ))s"

      - name: Generate web dashboard
        run: |
          OUTPUT_DIR=output python generate_web_dashboard.py

      - name: Upload Excel as artifact
        uses: actions/upload-artifact@v6
        with:
          name: stock-deviation-excel
          path: output/stock_deviation_*.xlsx
          retention-days: 30

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "📊 Stock screener $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output/docs
          publish_branch: gh-pages
          force_orphan: true      # gh-pages は最新版だけを持つ（毎日のJSONで履歴が膨らまないように）
