name: Long-term Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "longterm/backtest.py"
      - "scripts/backtest_longterm.py"
      - "scripts/backtest_swing.py"
      - ".github/workflows/backtest.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Long-term backtest (Nikkei 225 + check tickers)
        run: python scripts/backtest_longterm.py

      - name: Swing backtest (separate strategy)
        run: python scripts/backtest_swing.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/backtest
          git diff --cached --quiet && exit 0
          git commit -m "Backtest results $(date +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
