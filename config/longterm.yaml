# 長期投資（暴落点ルール）の設定
# 数値はすべてここで変更できる。既存の理想乖離ダッシュボードには影響しない。

deviation:
  sma_period: 25            # 乖離率の基準となる単純移動平均の日数

ideal_deviation:
  method: percentile        # 表示・シグナルに使う方式: percentile（経験的パーセンタイル） / sigma（平均±k×標準偏差）
  sigma_k: [2, 3]           # sigma 方式の k（-2σ, -3σ / +2σ, +3σ）
  percentiles:              # percentile 方式で -2σ/-3σ/+2σ/+3σ に相当させる分位点（%）
    lower2: 2.5
    lower3: 0.5
    upper2: 97.5
    upper3: 99.5
  min_days: 200             # これより短い履歴の銘柄は理想乖離を計算しない

crash_point:
  reset_months: 3           # 前回のタッチからこの期間（月）以上あいて初めてタッチした日を暴落点とする
  episode_max_days: 60      # 暴落点の安値を探す最大営業日数（乖離率が0%以上に戻るまで）
  entry_window_days: 5      # 条件A: 暴落点から何営業日以内なら「暴落点」とみなすか

  index_jp:
    ticker: "^N225"
    threshold_mode: fixed   # fixed（固定の乖離率） / sigma（その指数の理想乖離）
    threshold: -10.0        # 指数暴落点のしきい値（%）。-7.0 にも変更可
    severity:               # 暴落度（エピソード中の最小乖離率で判定）
      small: -7.0
      medium: -10.0
      large: -20.0

  index_us:
    tickers: ["^GSPC", "^DJI"]
    threshold_mode: sigma   # 米国は各指数の理想乖離を使う（fixed にすると threshold を使用）
    sigma_level: lower2     # sigma モード時のしきい値: lower2（-2σ相当） / lower3（-3σ相当）
    threshold: -7.0         # fixed モード時のしきい値（%）

  individual:
    band: lower2            # 個別暴落点の下限ライン: 理想乖離の lower2（-2σ相当）

legacy_lower_band:
  lookback_years: 10        # 旧方式の下限: 過去何年の乖離率で数えるか
  min_touches: 10           # 独立したタッチ回数がこの範囲になる乖離率を探す
  max_touches: 20
